<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>What do you need this for?</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            app: {
              bg: '#0D0D0F',
              card: '#1A1A1D',
              border: '#26262B',
              borderSubtle: '#1F1F24',
              textPrimary: '#F2F2F2',
              textSecondary: '#9A9A9F',
              textMuted: '#6B6B72',
              accent: '#FF3E6C',
              accentDark: '#E02E5A',
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #0D0D0F;
      color: #F2F2F2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #26262B;
      border-radius: 9999px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #F2F2F2;
      border: 3px solid #0D0D0F;
      box-shadow: 0 0 0 2px #3E3E45;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -9px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.15);
      box-shadow: 0 0 0 4px rgba(255, 62, 108, 0.4);
    }
    input[type=range]::-moz-range-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #26262B;
      border-radius: 9999px;
    }
    input[type=range]::-moz-range-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #F2F2F2;
      border: 3px solid #0D0D0F;
      box-shadow: 0 0 0 2px #3E3E45;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0D0D0F] text-[#F2F2F2] flex justify-center selection:bg-[#FF3E6C]/30 selection:text-white">
<!-- Mobile App Frame Container -->
<main class="w-full max-w-[420px] min-h-screen flex flex-col bg-[#0D0D0F] border-x border-[#1A1A1D]/60 relative pb-28">
<!-- Top App Navigation / Header Bar -->
<header class="sticky top-0 z-30 bg-[#0D0D0F]/95 backdrop-blur-md px-4 py-3.5 border-b border-[#1A1A1D] flex items-center justify-between">
<div class="flex items-center gap-3">
<button aria-label="Go back" class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-[#9A9A9F] hover:text-[#F2F2F2] hover:bg-[#1A1A1D] transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div>
<span class="text-[11px] font-medium tracking-wider uppercase text-[#9A9A9F]">Decision Support · Step 1</span>
<h1 class="text-[17px] font-bold text-[#F2F2F2] leading-tight">What do you need this for?</h1>
</div>
</div>
<!-- Perspective icon representing evidence & scale -->
<div class="w-9 h-9 rounded-full bg-[#1A1A1D] border border-[#26262B] flex items-center justify-center text-[#9A9A9F]">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</header>
<!-- Compact Product Summary Bar -->
<section class="px-4 py-3 bg-[#141417] border-b border-[#1F1F24] flex items-center justify-between gap-3">
<div class="flex items-center gap-3 min-w-0">
<!-- Thumbnail -->
<div class="w-12 h-12 rounded-[10px] bg-[#1A1A1D] border border-[#26262B] overflow-hidden flex-shrink-0 relative">
<img alt="Chanderi Kurta item thumbnail" class="w-full h-full object-cover object-center brightness-90 contrast-105" loading="lazy" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg">
</div>
<!-- Product Specs Summary -->
<div class="min-w-0">
<p class="text-[11px] font-semibold uppercase tracking-wider text-[#9A9A9F] truncate">Fabindia</p>
<h2 class="text-[14px] font-semibold text-[#F2F2F2] truncate">Chanderi Silk-Cotton Angrakha Kurta</h2>
<span class="text-[12px] text-[#9A9A9F]">Ref: CK-084</span>
</div>
</div>
<!-- Price -->
<div class="text-right flex-shrink-0">
<span class="text-[15px] font-bold text-[#F2F2F2]">₹1,899</span>
<span class="block text-[11px] text-[#6B6B72]">Inclusive of tax</span>
</div>
</section>
<!-- Main Content Container -->
<div class="p-4 space-y-4">
<!-- Block 1: What's the occasion? -->
<section class="bg-[#1A1A1D] border border-[#26262B] rounded-[14px] p-4 sm:p-5 shadow-sm">
<div class="flex items-center justify-between mb-3.5">
<label class="text-[16px] sm:text-[17px] font-bold text-[#F2F2F2] tracking-tight block">
            What's the occasion?
          </label>
<span class="text-[12px] text-[#9A9A9F] font-medium">Select one</span>
</div>
<!-- Wrapping Row of Selectable Chips -->
<div aria-label="What's the occasion?" class="flex flex-wrap gap-2.5" role="radiogroup">
<!-- Chip: Everyday -->
<button aria-checked="false" class="h-11 px-4 rounded-full text-[14px] font-medium border border-[#26262B] bg-[#141416] text-[#9A9A9F] hover:text-[#F2F2F2] hover:border-[#38383F] transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            Everyday
          </button>
<!-- Chip: College -->
<button aria-checked="false" class="h-11 px-4 rounded-full text-[14px] font-medium border border-[#26262B] bg-[#141416] text-[#9A9A9F] hover:text-[#F2F2F2] hover:border-[#38383F] transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            College
          </button>
<!-- Chip: Work (Selected in Coral Accent as requested) -->
<button aria-checked="true" class="h-11 px-4 rounded-full text-[14px] font-semibold border border-white bg-[#2a2a2e] text-white shadow-sm flex items-center gap-1.5 transition-all" role="radio" type="button">
<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
<span class="">Work</span>
</button>
<!-- Chip: Date -->
<button aria-checked="false" class="h-11 px-4 rounded-full text-[14px] font-medium border border-[#26262B] bg-[#141416] text-[#9A9A9F] hover:text-[#F2F2F2] hover:border-[#38383F] transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            Date
          </button>
<!-- Chip: Wedding or event -->
<button aria-checked="false" class="h-11 px-4 rounded-full text-[14px] font-medium border border-[#26262B] bg-[#141416] text-[#9A9A9F] hover:text-[#F2F2F2] hover:border-[#38383F] transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            Wedding or event
          </button>
<!-- Chip: Travel -->
<button aria-checked="false" class="h-11 px-4 rounded-full text-[14px] font-medium border border-[#26262B] bg-[#141416] text-[#9A9A9F] hover:text-[#F2F2F2] hover:border-[#38383F] transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            Travel
          </button>
</div>
</section>
<!-- Block 2: Wears slider & Cost-per-wear calculus -->
<section class="bg-[#1A1A1D] border border-[#26262B] rounded-[14px] p-4 sm:p-5 shadow-sm">
<label class="text-[16px] sm:text-[17px] font-bold text-[#F2F2F2] tracking-tight block leading-snug mb-3" for="wear-slider">
          Honestly, how many times can you see yourself wearing it?
        </label>
<!-- Current Value Display -->
<div class="py-2 flex items-baseline justify-between border-b border-[#26262B] mb-4">
<span class="text-[13px] text-[#9A9A9F] uppercase tracking-wider font-medium">Projected Usage</span>
<div class="text-right">
<span class="text-[28px] font-bold text-[#F2F2F2] tracking-tight leading-none">10</span>
<span class="text-[17px] font-medium text-[#9A9A9F] ml-1">wears</span>
</div>
</div>
<!-- Slider Component -->
<div class="space-y-2 mb-5">
<div class="relative py-1">
<input aria-label="Expected wear frequency" class="w-full" id="wear-slider" max="30" min="1" step="1" type="range" value="10">
</div>
<!-- Slider Track Labels -->
<div class="flex justify-between text-[12px] text-[#6B6B72] font-medium px-0.5">
<span class="">1 wear</span>
<span class="">15</span>
<span class="">30+ wears</span>
</div>
</div>
<!-- Mathematical Calculation Line (Neutral, strictly factual) -->
<div class="bg-[#121214] border border-[#26262B] rounded-[10px] p-3.5 mb-3">
<div class="flex items-center justify-between">
<span class="text-[12px] uppercase tracking-wider text-[#9A9A9F] font-semibold">Cost per wear</span>
<span class="text-[15px] font-medium text-[#F2F2F2] tabular-nums">
              ₹1,899 ÷ 10 wears = <strong class="font-bold text-white">₹190</strong> per wear
            </span>
</div>
</div>
<!-- Factual Reference Note (No qualitative judgment or rating badge) -->
<p class="text-[13px] text-[#9A9A9F] italic leading-relaxed">
          Everyday and casual wear is typically worn 15–30 times.
        </p>
</section>
<!-- Block 3: What's your main hesitation? -->
<section class="bg-[#1A1A1D] border border-[#26262B] rounded-[14px] p-4 sm:p-5 shadow-sm">
<label class="text-[16px] sm:text-[17px] font-bold text-[#F2F2F2] tracking-tight block mb-3.5">
          What's your main hesitation?
        </label>
<!-- Vertical list of tappable rows with radio indicators -->
<div aria-label="What's your main hesitation?" class="space-y-2" role="radiogroup">
<!-- Row 1: Is it worth the price? -->
<label class="flex items-center justify-between p-3.5 rounded-[10px] bg-[#141416] border border-[#26262B] hover:border-[#38383F] cursor-pointer transition-colors min-h-[48px]">
<span class="text-[15px] text-[#F2F2F2] font-medium">Is it worth the price?</span>
<input class="sr-only" name="hesitation" type="radio" value="price">
<div class="w-5 h-5 rounded-full border border-[#9A9A9F]/60 flex items-center justify-center flex-shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Row 2: Will it fit? (Selected state shown neutrally) -->
<label class="flex items-center justify-between p-3.5 rounded-[10px] bg-[#1E1E22] border border-[#3E3E45] cursor-pointer transition-colors min-h-[48px]">
<span class="text-[15px] text-white font-semibold">Will it fit?</span>
<input checked="" class="sr-only" name="hesitation" type="radio" value="fit">
<!-- Neutral radio indicator: greyscale, carrying meaning without colored alarm -->
<div class="w-5 h-5 rounded-full border-2 border-[#F2F2F2] flex items-center justify-center flex-shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-[#F2F2F2]"></div>
</div>
</label>
<!-- Row 3: Can I trust this listing? -->
<label class="flex items-center justify-between p-3.5 rounded-[10px] bg-[#141416] border border-[#26262B] hover:border-[#38383F] cursor-pointer transition-colors min-h-[48px]">
<span class="text-[15px] text-[#F2F2F2] font-medium">Can I trust this listing?</span>
<input class="sr-only" name="hesitation" type="radio" value="trust">
<div class="w-5 h-5 rounded-full border border-[#9A9A9F]/60 flex items-center justify-center flex-shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Row 4: Will I actually wear it? -->
<label class="flex items-center justify-between p-3.5 rounded-[10px] bg-[#141416] border border-[#26262B] hover:border-[#38383F] cursor-pointer transition-colors min-h-[48px]">
<span class="text-[15px] text-[#F2F2F2] font-medium">Will I actually wear it?</span>
<input class="sr-only" name="hesitation" type="radio" value="frequency">
<div class="w-5 h-5 rounded-full border border-[#9A9A9F]/60 flex items-center justify-center flex-shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Row 5: Is it right for the occasion? -->
<label class="flex items-center justify-between p-3.5 rounded-[10px] bg-[#141416] border border-[#26262B] hover:border-[#38383F] cursor-pointer transition-colors min-h-[48px]">
<span class="text-[15px] text-[#F2F2F2] font-medium">Is it right for the occasion?</span>
<input class="sr-only" name="hesitation" type="radio" value="occasion">
<div class="w-5 h-5 rounded-full border border-[#9A9A9F]/60 flex items-center justify-center flex-shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
</div>
</section>
</div>
<!-- Sticky Bottom CTA Area with Coral Button -->
<div class="fixed bottom-0 left-0 right-0 z-40 flex justify-center pointer-events-none">
<div class="w-full max-w-[420px] p-4 bg-gradient-to-t from-[#0D0D0F] via-[#0D0D0F]/95 to-transparent pt-6 pointer-events-auto border-t border-[#1A1A1D]/80">
<button class="w-full h-12 bg-[#FF3E6C] hover:bg-[#E02E5A] active:scale-[0.99] text-white font-bold text-[15px] rounded-[12px] flex items-center justify-center gap-2 shadow-lg shadow-[#FF3E6C]/20 transition-all focus:outline-none focus:ring-2 focus:ring-[#FF3E6C] focus:ring-offset-2 focus:ring-offset-[#0D0D0F]" type="button">
<span class="">Generate my Match Check</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
</div>
</main>




</body></html>
